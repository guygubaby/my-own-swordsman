<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>同福弹幕</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #17110b;
        --card: rgba(244, 231, 211, 0.055);
        --line: rgba(244, 231, 211, 0.12);
        --cream: #f4e7d3;
        --muted: rgba(244, 231, 211, 0.52);
        --cinnabar: #a8342a;
        --cinnabar-hi: #bf4234;
        --gold: #d8b071;
        --jade: #8fbf9f;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: #0d0906;
      }
      body {
        width: 344px;
        margin: 0;
        padding: 8px;
        background: #0d0906;
        color: var(--cream);
        font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .app {
        padding: 14px 14px 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background:
          radial-gradient(120% 80% at 12% -10%, rgba(168, 52, 42, 0.28), transparent 60%),
          radial-gradient(90% 70% at 100% 0%, rgba(184, 138, 69, 0.13), transparent 55%),
          var(--bg);
      }
      .hero {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .seal {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        flex: none;
        border-radius: 10px;
        border: 1px solid rgba(216, 176, 113, 0.45);
        background: linear-gradient(160deg, #b64033, #7f241c);
        box-shadow:
          inset 0 0 0 1px rgba(255, 248, 236, 0.12),
          0 6px 16px rgba(0, 0, 0, 0.35);
        font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #fff3df;
      }
      h1 {
        margin: 0;
        font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .ver {
        display: inline-block;
        margin-left: 4px;
        padding: 1px 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font: 9.5px/1.4 ui-monospace, "SF Mono", monospace;
        vertical-align: 1px;
      }
      .hero p {
        margin: 1px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
      .card {
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: linear-gradient(180deg, var(--card), rgba(244, 231, 211, 0.02));
      }
      .status {
        display: flex;
        align-items: flex-start;
        gap: 9px;
      }
      .dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        flex: none;
        border-radius: 50%;
        background: #6b5b46;
        box-shadow: 0 0 0 3px rgba(107, 91, 70, 0.18);
        transition: background 0.2s;
      }
      .dot.on {
        background: var(--jade);
        box-shadow:
          0 0 0 3px rgba(143, 191, 159, 0.16),
          0 0 10px rgba(143, 191, 159, 0.5);
      }
      .dot.warn {
        background: var(--gold);
        box-shadow: 0 0 0 3px rgba(216, 176, 113, 0.16);
      }
      .status-copy {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .status-copy strong {
        font-size: 13.5px;
        font-weight: 600;
      }
      .status-copy span {
        font-size: 11px;
        color: var(--muted);
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 11px;
        padding-top: 11px;
        border-top: 1px dashed var(--line);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 50%;
        border: 1px solid rgba(216, 176, 113, 0.35);
        background: rgba(216, 176, 113, 0.14);
        color: var(--gold);
        font-family: "Songti SC", "Noto Serif SC", serif;
        font-size: 13px;
        font-weight: 700;
      }
      .name {
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        margin-top: 12px;
      }
      .actions .btn {
        width: 100%;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 33px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 9px;
        font: inherit;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .primary {
        border-color: rgba(255, 248, 236, 0.08);
        background: var(--cinnabar);
        color: #fff8ec;
      }
      .primary:hover {
        background: var(--cinnabar-hi);
      }
      .ghost {
        border-color: var(--line);
        background: rgba(244, 231, 211, 0.05);
        color: var(--cream);
      }
      .ghost:hover {
        background: rgba(244, 231, 211, 0.09);
      }
      .ghost.danger {
        color: rgba(255, 190, 178, 0.85);
      }
      .ghost.danger:hover {
        border-color: rgba(191, 66, 52, 0.45);
        background: rgba(168, 52, 42, 0.14);
      }
      footer {
        margin-top: 10px;
        padding-right: 2px;
        text-align: right;
      }
      footer a {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
        font-size: 11px;
        text-decoration: none;
        transition: color 0.15s;
      }
      footer a:hover {
        color: var(--gold);
      }
      footer svg {
        width: 11px;
        height: 11px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="hero">
      <div class="seal" aria-hidden="true">同福</div>
      <div>
        <h1>同福弹幕<span class="ver" id="ver"></span></h1>
        <p>央视网《武林外传》弹幕层</p>
      </div>
    </header>

    <section class="card">
      <div class="status">
        <span class="dot" id="dot"></span>
        <div class="status-copy">
          <strong id="status-title">正在对暗号……</strong>
          <span id="status-sub">马上就好</span>
        </div>
      </div>

      <div class="identity hidden" id="identity">
        <span class="avatar" id="avatar">同</span>
        <span class="name" id="nickname">腐竹</span>
      </div>

      <div class="actions">
        <button id="connect" class="btn primary" type="button">连接同福账号</button>
        <button id="disconnect" class="btn ghost danger hidden" type="button">断开连接</button>
      </div>
    </section>

      <footer>
        <a id="open-site" href="https://tongfu.guygubaby.top" target="_blank" rel="noreferrer">
          同福娱乐镇
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h6v6" />
            <path d="M10 14 21 3" />
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          </svg>
        </a>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
